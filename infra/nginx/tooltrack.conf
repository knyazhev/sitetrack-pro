server {
    listen 80;
    server_name _;

    set $authelia_backend "http://authelia:9091";

    location /api/ {
        auth_request /authelia;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $roles $upstream_http_remote_groups;
        proxy_set_header X-User-Id $user;
        proxy_set_header X-User-Roles $roles;
        proxy_set_header Host $host;
        proxy_pass http://api:8000/;
    }

    location /pwa/ {
        auth_request /authelia;
        try_files $uri $uri/ /pwa/index.html;
        proxy_pass http://pwa:4173;
    }

    location /web/ {
        auth_request /authelia;
        try_files $uri $uri/ /web/index.html;
        proxy_pass http://web:4174;
    }

    location = /authelia {
        internal;
        proxy_pass $authelia_backend/api/verify?rd=https://$host$uri;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }
}
